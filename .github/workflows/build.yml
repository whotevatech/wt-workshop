name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both jars
        run: ./gradlew build --no-daemon
      - name: Game tests (base mod)
        run: ./gradlew runGameTestServer --no-daemon
      - name: Game tests (with BeeBlock addon)
        run: ./gradlew runGameTestServer -PwithBeeAddon --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/libs/wt-workshop-*.jar
            build/libs/wt-beeblock-workshop-*.jar
          if-no-files-found: error
